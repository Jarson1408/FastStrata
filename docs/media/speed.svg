<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Writing speed in tokens per second. Laptop with an 8 GB card: Qwen3.6-35B-A3B 94 to 100, Gemma 4 26B-A4B 92 to 93, Ornith 1.5 76 to 82, Tiel Coder 35B-A3B 83. Workstation with a 32 GB card: Qwen3.6-35B-A3B 385 to 393, Gemma 4 26B-A4B 326 to 349, Ornith 1.5 303 to 315, Tiel Coder 35B-A3B 308 to 312, GLM 5.3 Flash 59 to 66."><title>Writing speed of the five added models, tokens per second</title>
