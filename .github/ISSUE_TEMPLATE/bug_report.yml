name: Bug report
description: Something in FastStrata doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    value: |
      Thanks for the report.

      Please search the [open issues](https://github.com/Jarson1408/FastStrata/issues?q=is%3Aissue+state%3Aopen) first — this may already be tracked.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you got, and what you expected instead. Paste the exact error text if there is one. If there's a set of steps or commands that reproduces it, put them here too.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: FastStrata version, GPU, OS
      description: The engine version is on the About tab, or in `GET /v1/status` under `engine`.
      placeholder: "0.1.31 · RTX 5070 12GB · Windows 11"
    validations:
      required: true
  - type: textarea
    id: setup-log
    attributes:
      label: Setup log (if setup stopped or misbehaved)
      description: Drag in the newest `logs/setup-<date>-<time>.log` from your FastStrata folder; setup names it where it stops. Your account and PC names and any API key are already taken out of it.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Engine log
      description: Drag in `strata-<model>.log` from your FastStrata folder. Drag and drop works directly into this box.
    validations:
      required: false
  - type: textarea
    id: gateway-log
    attributes:
      label: Gateway logs (if OpenCode or the FastStrata app is involved)
      description: From `gateway/` in your FastStrata folder, drag in `gateway.log` and `gui.log`.
    validations:
      required: false
  - type: markdown
    value: |
      A couple of extras that help a lot:

      - Check the [troubleshooting table](https://github.com/Jarson1408/FastStrata/blob/main/docs/DETAILS.md#troubleshooting) first, many reports are already solved there.